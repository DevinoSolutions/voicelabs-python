# This workflow uses PyPI Trusted Publishing (OIDC) — no API token/password. It will
# FAIL until a trusted publisher for the `voicelabs-sdk` project is registered on PyPI:
#   PyPI -> project `voicelabs-sdk` -> Publishing -> add GitHub publisher:
#   owner: DevinoSolutions, repo: voicelabs-python, workflow: publish.yml,
#   environment: pypi
# Do NOT dispatch this workflow before that is done.
name: Publish

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
